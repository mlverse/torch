name: Setup CMake
description: Install CMake without querying the GitHub releases API
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        version=3.25.1
        case "$RUNNER_OS" in
          Linux) archive="cmake-${version}-linux-x86_64.tar.gz"; bin=bin ;;
          macOS) archive="cmake-${version}-macos-universal.tar.gz"; bin=CMake.app/Contents/bin ;;
          Windows) archive="cmake-${version}-windows-x86_64.zip"; bin=bin ;;
          *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        install_dir="$RUNNER_TEMP/cmake-${version}"
        mkdir -p "$install_dir"
        curl --fail --location --retry 5 --retry-delay 5 \
          "https://cmake.org/files/v3.25/${archive}" -o "$RUNNER_TEMP/$archive"
        tar -xf "$RUNNER_TEMP/$archive" -C "$install_dir" --strip-components=1
        cmake_bin="$install_dir/$bin"
        "$cmake_bin/cmake" --version
        if [ "$RUNNER_OS" = Windows ]; then
          cmake_bin="$(cygpath -w "$cmake_bin")"
        fi
        echo "$cmake_bin" >> "$GITHUB_PATH"
